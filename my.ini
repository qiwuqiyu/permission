# MySQL 配置文件 —— mysqld（服务端程序）启动时读取
# 数据目录放在项目文件夹里，方便管理和查看（正式环境通常放 C:\ProgramData\MySQL）

[mysqld]
# 程序安装目录
basedir=C:/Program Files/MySQL/MySQL Server 8.4
# 数据实际存放目录（库、表、数据都在这里面，相当于之前 test.db 的角色）
datadir=C:/Users/84486/Desktop/python/mysql-data
# 监听端口（和 Workbench 连接配置里填的一致）
port=3306
# 中文支持：utf8mb4 才能存 emoji 和全部中文，新项目一律用它
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci
# 只允许本机连接（学习机够用也更安全）
bind-address=127.0.0.1
